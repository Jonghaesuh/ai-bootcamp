[project]
name = "req2data-agent"
version = "0.1.0"
description = "요구사항 정의서 → ML 데이터셋 설계(구조화·매핑·타깃/피처·마트 SQL·검증)를 자동화하는 LangGraph Multi-Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Agent / LLM (기본 Azure OpenAI GPT. 로컬·기타 제공자는 extra `local`)
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    # RAG
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "networkx>=3.3",
    # Data
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "sqlglot>=25",
    # Config / schema
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "streamlit>=1.38",
    "python-multipart>=0.0.9",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.3",
]

[project.optional-dependencies]
# Ollama(qwen2.5·bge-m3)·Gemini 제공자. Docker 이미지에는 넣지 않는다.
local = [
    "langchain-ollama>=0.3",
    "langchain-google-genai>=4.4.2",
]
# MCP 카탈로그 서버 (PRD 2.5 B)
mcp = ["mcp[cli]>=1.9", "langchain-mcp-adapters>=0.1"]
a2a = ["a2a-sdk>=0.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/req2data", "src/mcp_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: LLM(Ollama 등) 호출이 필요한 테스트",
    "integration: DB·인덱스가 준비되어야 하는 통합 테스트",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # 줄 길이는 ruff format이 관리하고, 긴 한글 문자열은 허용

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]  # FastAPI 의존성 주입 관용구
