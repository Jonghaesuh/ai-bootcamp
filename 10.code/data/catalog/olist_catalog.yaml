# Olist 브라질 이커머스 데이터 카탈로그 (공개 데이터 사전 + 한글 설명)
# time_rank: 업무 흐름상 시점 순서 (작을수록 먼저 생김). 누수 판정의 기준.
# available_at: 이 컬럼 값이 확정되는 시점 컬럼. 비어 있으면 시점과 무관한 속성(마스터 정보).
dataset: olist
source: https://www.kaggle.com/datasets/olistbr/brazilian-ecommerce
period: 2016-09 ~ 2018-10 (2018-09 이후는 주문 수가 급감해 불완전)

tables:
  customers:
    source_file: olist_customers_dataset.csv
    description: 주문 고객 정보. customer_id는 주문마다 새로 발급되는 키이고, 실제 고객 단위는 customer_unique_id다.
    grain: 주문당 1행 (customer_id 기준)
    columns:
      - {name: customer_id, type: VARCHAR, pk: true, description: 주문별 고객 키. 같은 사람도 주문마다 다른 값을 가진다, description_en: key to the orders dataset; each order has a unique customer_id}
      - {name: customer_unique_id, type: VARCHAR, description: 실제 고객 고유 ID. 재구매·고객 단위 분석의 키, description_en: unique identifier of a customer}
      - {name: customer_zip_code_prefix, type: VARCHAR, fk: geolocation.geolocation_zip_code_prefix, description: 고객 우편번호 앞 5자리, description_en: first five digits of customer zip code}
      - {name: customer_city, type: VARCHAR, description: 고객 도시, description_en: customer city name}
      - {name: customer_state, type: VARCHAR, description: 고객 주(州) 약어 (예 SP, RJ), description_en: customer state}

  geolocation:
    source_file: olist_geolocation_dataset.csv
    description: 브라질 우편번호별 위경도. 같은 우편번호에 여러 행이 있어 조인 전에 우편번호 단위로 집계해야 한다.
    grain: 우편번호 앞자리 × 좌표 (중복 많음)
    columns:
      - {name: geolocation_zip_code_prefix, type: VARCHAR, description: 우편번호 앞 5자리 (고유하지 않음), description_en: first 5 digits of zip code}
      - {name: geolocation_lat, type: DOUBLE, description: 위도, description_en: latitude}
      - {name: geolocation_lng, type: DOUBLE, description: 경도, description_en: longitude}
      - {name: geolocation_city, type: VARCHAR, description: 도시, description_en: city name}
      - {name: geolocation_state, type: VARCHAR, description: 주 약어, description_en: state}

  orders:
    source_file: olist_orders_dataset.csv
    description: 주문 헤더. 주문 상태와 구매·결제 승인·배송 단계별 시각을 담은 중심 테이블.
    grain: 주문당 1행
    columns:
      - {name: order_id, type: VARCHAR, pk: true, description: 주문 ID, description_en: unique identifier of the order}
      - {name: customer_id, type: VARCHAR, fk: customers.customer_id, description: 주문 고객 키 (customers 조인용), description_en: key to the customer dataset}
      - {name: order_status, type: VARCHAR, description: "주문 상태 (delivered, shipped, canceled, unavailable, invoiced, processing, created, approved). 데이터 추출 시점의 최종 상태라 예측 시점에는 알 수 없을 수 있다", description_en: order status, note: 최종 상태 스냅샷. 모집단 필터로 쓰면 이후 취소 정보가 섞일 수 있음}
      - {name: order_purchase_timestamp, type: TIMESTAMP, time_rank: 1, description: 구매(주문) 시각, description_en: purchase timestamp}
      - {name: order_approved_at, type: TIMESTAMP, time_rank: 2, description: 결제 승인 시각, description_en: payment approval timestamp}
      - {name: order_delivered_carrier_date, type: TIMESTAMP, time_rank: 3, description: 물류사 인계 시각, description_en: order posting timestamp, handed to the logistic partner}
      - {name: order_delivered_customer_date, type: TIMESTAMP, time_rank: 4, description: 고객 배송 완료 시각, description_en: actual order delivery date to the customer}
      - {name: order_estimated_delivery_date, type: TIMESTAMP, available_at: orders.order_purchase_timestamp, description: 구매 시 고객에게 안내된 예상 배송일. 구매 시점에 알 수 있다, description_en: estimated delivery date informed at purchase}

  order_items:
    source_file: olist_order_items_dataset.csv
    description: 주문 상품 상세. 주문 하나에 여러 상품(행)이 있을 수 있다.
    grain: 주문 × 상품 순번
    columns:
      - {name: order_id, type: VARCHAR, fk: orders.order_id, description: 주문 ID, description_en: order unique identifier}
      - {name: order_item_id, type: INTEGER, description: 주문 내 상품 순번, description_en: sequential number identifying items in the same order}
      - {name: product_id, type: VARCHAR, fk: products.product_id, description: 상품 ID, description_en: product unique identifier}
      - {name: seller_id, type: VARCHAR, fk: sellers.seller_id, description: 판매자 ID, description_en: seller unique identifier}
      - {name: shipping_limit_date, type: TIMESTAMP, available_at: orders.order_approved_at, description: 판매자가 물류사에 넘겨야 하는 기한, description_en: seller shipping limit date}
      - {name: price, type: DOUBLE, available_at: orders.order_purchase_timestamp, description: 상품 가격, description_en: item price}
      - {name: freight_value, type: DOUBLE, available_at: orders.order_purchase_timestamp, description: 상품별 배송비, description_en: item freight value}

  order_payments:
    source_file: olist_order_payments_dataset.csv
    description: 주문 결제 정보. 주문 하나에 결제 수단이 여러 개일 수 있다 (바우처 분할 결제 등).
    grain: 주문 × 결제 순번
    columns:
      - {name: order_id, type: VARCHAR, fk: orders.order_id, description: 주문 ID, description_en: order unique identifier}
      - {name: payment_sequential, type: INTEGER, description: 결제 순번, description_en: sequence of payment methods for the order}
      - {name: payment_type, type: VARCHAR, available_at: orders.order_purchase_timestamp, description: "결제 수단 (credit_card, boleto, voucher, debit_card)", description_en: method of payment}
      - {name: payment_installments, type: INTEGER, available_at: orders.order_purchase_timestamp, description: 할부 개월 수, description_en: number of installments}
      - {name: payment_value, type: DOUBLE, available_at: orders.order_purchase_timestamp, description: 결제 금액, description_en: transaction value}

  order_reviews:
    source_file: olist_order_reviews_dataset.csv
    description: 고객 리뷰. 보통 배송 완료 후(또는 예상 배송일 이후) 설문으로 수집된다.
    grain: 리뷰당 1행 (주문당 여러 리뷰가 있을 수 있음)
    columns:
      - {name: review_id, type: VARCHAR, pk: true, description: 리뷰 ID (고유하지 않은 경우가 있음), description_en: unique review identifier}
      - {name: order_id, type: VARCHAR, fk: orders.order_id, description: 주문 ID, description_en: unique order identifier}
      - {name: review_score, type: INTEGER, available_at: order_reviews.review_creation_date, description: 만족도 점수 1~5, description_en: satisfaction score from 1 to 5}
      - {name: review_comment_title, type: VARCHAR, available_at: order_reviews.review_creation_date, description: 리뷰 제목 (포르투갈어), description_en: comment title}
      - {name: review_comment_message, type: VARCHAR, available_at: order_reviews.review_creation_date, description: 리뷰 본문 (포르투갈어), description_en: comment message}
      - {name: review_creation_date, type: TIMESTAMP, time_rank: 5, description: 리뷰 설문 발송 시각, description_en: date the satisfaction survey was sent}
      - {name: review_answer_timestamp, type: TIMESTAMP, time_rank: 6, description: 리뷰 응답 시각, description_en: satisfaction survey answer timestamp}

  products:
    source_file: olist_products_dataset.csv
    description: 상품 마스터. 카테고리와 상품 크기·무게 등 속성.
    grain: 상품당 1행
    columns:
      - {name: product_id, type: VARCHAR, pk: true, description: 상품 ID, description_en: unique product identifier}
      - {name: product_category_name, type: VARCHAR, fk: product_category_name_translation.product_category_name, description: 상품 카테고리 (포르투갈어), description_en: root category of product in Portuguese}
      - {name: product_name_lenght, type: DOUBLE, description: 상품명 글자 수 (원본 컬럼명 철자 그대로), description_en: number of characters of the product name}
      - {name: product_description_lenght, type: DOUBLE, description: 상품 설명 글자 수, description_en: number of characters of the product description}
      - {name: product_photos_qty, type: DOUBLE, description: 상품 사진 수, description_en: number of product published photos}
      - {name: product_weight_g, type: DOUBLE, description: 무게(g), description_en: product weight in grams}
      - {name: product_length_cm, type: DOUBLE, description: 길이(cm), description_en: product length in centimeters}
      - {name: product_height_cm, type: DOUBLE, description: 높이(cm), description_en: product height in centimeters}
      - {name: product_width_cm, type: DOUBLE, description: 너비(cm), description_en: product width in centimeters}

  sellers:
    source_file: olist_sellers_dataset.csv
    description: 판매자 마스터.
    grain: 판매자당 1행
    columns:
      - {name: seller_id, type: VARCHAR, pk: true, description: 판매자 ID, description_en: seller unique identifier}
      - {name: seller_zip_code_prefix, type: VARCHAR, fk: geolocation.geolocation_zip_code_prefix, description: 판매자 우편번호 앞 5자리, description_en: first 5 digits of seller zip code}
      - {name: seller_city, type: VARCHAR, description: 판매자 도시, description_en: seller city name}
      - {name: seller_state, type: VARCHAR, description: 판매자 주 약어, description_en: seller state}

  product_category_name_translation:
    source_file: product_category_name_translation.csv
    description: 상품 카테고리 포르투갈어 → 영어 번역표.
    grain: 카테고리당 1행
    columns:
      - {name: product_category_name, type: VARCHAR, pk: true, description: 카테고리 (포르투갈어), description_en: category name in Portuguese}
      - {name: product_category_name_english, type: VARCHAR, description: 카테고리 (영어), description_en: category name in English}
