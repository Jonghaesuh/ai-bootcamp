# 요구사항·매핑 → DesignPlan 예시. 평가용 샘플 도메인(이커머스)은 넣지 않는다.
- id: subscription_renewal
  domain: media
  input: |
    모집단: 연간 구독을 처음 시작한 회원 / 단위: 회원 / 예측 시점: 첫 구독 결제 직후 / 타깃: 첫 결제 후 400일 내 재결제(갱신)
    테이블: members(member_id PK, signup_channel), payments(payment_id PK, member_id FK, paid_at, amount, plan_type)
  output:
    analysis_unit: 회원
    entity_key: members.member_id
    reference_time: payments.paid_at
    cohort: first_event
    population_filters:
      - payments.plan_type = 'annual'
    target:
      kind: repeat_event
      window_days: 400
      description: 첫 연간 결제 후 400일 안에 다음 결제(갱신)
    features:
      - {name: first_amount, source_column: payments.amount, agg: sum, requirement_ids: [R3]}
      - {name: signup_channel, source_column: members.signup_channel, agg: first, requirement_ids: [R4]}
    rationale: 행동(갱신 독려) 대상이 회원이라 회원 단위, 첫 결제 시점을 기준으로 다음 결제를 타깃으로 했다. 피처는 첫 결제 시점에 알 수 있는 값만 썼다.
- id: card_delinquency
  domain: finance
  input: |
    모집단: 승인된 신규 발급 신청 / 단위: 신청 건 / 예측 시점: 심사 시점 / 타깃: 발급 후 180일 내 30일 이상 연체
    테이블: applications(app_id PK, applied_at, income, approved), statements(statement_id PK, app_id FK, due_date, days_past_due)
  output:
    analysis_unit: 발급 신청 건
    entity_key: applications.app_id
    reference_time: applications.applied_at
    cohort: every_event
    population_filters:
      - applications.approved = true
    target:
      kind: condition
      window_days: 180
      condition: statements.days_past_due >= 30 AND statements.due_date <= applications.applied_at + INTERVAL 180 DAY
      description: 발급 후 180일 안에 30일 이상 연체
    features:
      - {name: income, source_column: applications.income, agg: first, requirement_ids: [R1]}
    rationale: 심사 시점에는 신청서 정보만 알 수 있어 명세서(statements)는 타깃 조건에만 썼다.
- id: hospital_readmission
  domain: healthcare
  input: |
    모집단: 퇴원한 입원 건 / 단위: 입원 건 / 예측 시점: 퇴원 시각 / 타깃: 같은 환자의 30일 내 재입원
    테이블: patients(patient_id PK, age_group), admissions(admission_id PK, patient_id FK, admitted_at, discharged_at, diagnosis), procedures(procedure_id PK, admission_id FK, cost)
  output:
    analysis_unit: 입원 건
    entity_key: patients.patient_id
    reference_time: admissions.discharged_at
    cohort: every_event
    population_filters: []
    target:
      kind: repeat_event
      window_days: 30
      description: 퇴원 후 30일 안에 같은 환자의 다음 입원
    features:
      - {name: diagnosis, source_column: admissions.diagnosis, agg: first, requirement_ids: [R2]}
      - {name: procedure_cost, source_column: procedures.cost, agg: sum, requirement_ids: [R3]}
      - {name: n_procedures, source_column: procedures.procedure_id, agg: count, requirement_ids: [R3]}
    rationale: 입원마다 예측하므로 every_event, 같은 환자의 다음 입원을 타깃으로 하려고 분석 키를 환자 ID로 두었다. 시술 정보는 입원 건 단위로 합계·건수로 집계했다.
